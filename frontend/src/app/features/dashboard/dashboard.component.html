<div class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Fintech Dashboard</h1>
        <div class="flex items-center gap-4">
            <span>{{ authService.currentUser()?.fullName }}</span>
            <button (click)="logout()" class="text-red-600 hover:text-red-800">Logout</button>
        </div>
    </nav>
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Your Expenses</h2>
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Expense</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded shadow">
                <h3 class="text-gray-500 text-sm">Total Expenses</h3>
                <p class="text-3xl font-bold mt-2">$24,500</p>
            </div>
            <div class="bg-white p-6 rounded shadow">
                <h3 class="text-gray-500 text-sm">Pending</h3>
                <p class="text-3xl font-bold mt-2 text-orange-500">5</p>
            </div>
            <div class="bg-white p-6 rounded shadow">
                <h3 class="text-gray-500 text-sm">Approved</h3>
                <p class="text-3xl font-bold mt-2 text-green-500">$12,000</p>
            </div>
        </div>

        <!-- List -->
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="min-w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Description</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Amount</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr *ngFor="let expense of expenses()">
                        <td class="px-6 py-4 whitespace-nowrap">{{ expense.createdAt | date }}</td>
                        <td class="px-6 py-4">{{ expense.description }}</td>
                        <td class="px-6 py-4 font-bold">{{ expense.amount | currency:expense.currency }}</td>
                        <td class="px-6 py-4">
                            <span
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                {{ expense.status }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
