<div class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Fintech Dashboard</h1>
        <div class="flex items-center gap-4">
            <span>{{ authService.currentUser()?.fullName }}</span>
            <button z-button zType="destructive" zSize="sm" (click)="logout()">Logout</button>
        </div>
    </nav>
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Your Expenses</h2>
            <button z-button (click)="openExpenseForm()">
                New Expense
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Total Expenses</h3>
                <p class="text-3xl font-bold mt-2 text-gray-900">{{ totalExpenses() | currency }}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Pending</h3>
                <p class="text-3xl font-bold mt-2 text-orange-500">5</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Approved</h3>
                <p class="text-3xl font-bold mt-2 text-green-500">$12,000</p>
            </div>
        </div>

        <!-- List -->
        <app-expense-list [expenses]="expenses()" (edit)="openExpenseForm($event)">
        </app-expense-list>
    </div>
</div>
