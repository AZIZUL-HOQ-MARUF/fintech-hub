<div class="min-h-screen flex">
    <!-- Left Side: Brand -->
    <div
        class="hidden lg:flex w-1/2 bg-gradient-to-br from-indigo-900 to-slate-900 items-center justify-center text-white p-12 relative overflow-hidden">
        <div
            class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] mix-blend-overlay">
        </div>
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-transparent to-black/30"></div>
        <div class="relative z-10 max-w-lg">
            <div class="mb-6 flex items-center space-x-3">
                <h1 class="text-5xl font-extrabold tracking-tight text-white">Fintech<span
                        class="text-indigo-400">Hub</span></h1>
            </div>
            <p class="text-xl text-indigo-100/90 leading-relaxed font-light">Experience the next generation of
                enterprise expense management. Secure, fast, and intelligent.</p>
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-slate-50">
        <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl border border-slate-100">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-bold text-slate-800">Welcome Back</h2>
                <p class="text-slate-500 mt-2">Please enter your details to sign in.</p>
            </div>

            <form (ngSubmit)="onSubmit()" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input [(ngModel)]="email" name="email" type="email"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white text-slate-900 placeholder:text-slate-400"
                        placeholder="you@company.com" required>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">Password</label>
                        <a href="#" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">Forgot
                            password?</a>
                    </div>
                    <input [(ngModel)]="password" name="password" type="password"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white text-slate-900 placeholder:text-slate-400"
                        placeholder="••••••••" required>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition-all shadow-lg shadow-indigo-500/30 transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-slate-600">
                Don't have an account?
                <a routerLink="/auth/register"
                    class="text-indigo-600 hover:text-indigo-800 font-semibold hover:underline">Create account</a>
            </p>
        </div>
    </div>
</div>
